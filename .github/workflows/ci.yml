name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package extension
        run: npm run package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vrata-provider-spike-vsix
          path: vrata-provider-spike-*.vsix
          if-no-files-found: error
